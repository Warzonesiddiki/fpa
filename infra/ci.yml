name: CI

on:
  pull_request:
  push:
    branches: [main, "arena/**"]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Stage 2+6+11: Lint, type, docs, schema/money gates ───────────────
  lint-type-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Type check (Stage 2)
        run: npm run typecheck
      - name: ESLint --max-warnings 0 (Stage 2)
        run: npm run lint
      - name: Prettier check (Stage 2)
        run: npm run fmt:check
      - name: Docs index completeness (Stage 11 / B8)
        run: npm run docs:verify
      - name: Money AST gate (Stage 6 / B3)
        run: npm run money:ast
      - name: Pack schema gate (Stage 6 / B15)
        run: npm run packs:validate
      - name: Secret scan (Stage 10)
        run: node scripts/secret-scan.mjs
      - name: Telemetry scan (Stage 10 / B18-9)
        run: node scripts/telemetry-scan.mjs
      - name: License gate (Stage 10)
        run: node scripts/license-check.mjs

  # ── Stage 3: TS unit + coverage gate ──────────────────────────────────
  unit-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx playwright install --with-deps chromium
      - name: Vitest + coverage (Stage 3, gate ≥85/80)
        run: npx vitest run --coverage
      - name: Playwright smoke (UI P0 states)
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-ui
          path: |
            coverage/
            playwright-report/
            test-results/

  # ── Stage 4: Rust unit + proptest (3 OS parity per B18-8) ─────────────
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: cargo fmt --check (Stage 2)
        working-directory: src-tauri
        run: cargo fmt --check
      - name: cargo clippy -D warnings (Stage 2)
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo test (Stage 4 — money/calendar/audit, proptest)
        working-directory: src-tauri
        run: cargo test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-rust-${{ matrix.os }}
          path: src-tauri/target/coverage

  # ── Stage 12: Release dry-run (build, no bundle) per OS ───────────────
  build-dry-run:
    needs: [lint-type-docs, unit-ts, rust]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux system deps (Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --legacy-peer-deps
      - name: Tauri build --no-bundle (Stage 12)
        run: npx tauri build --no-bundle

  # ── Stage 10: dependency security audits ─────────────────────────────
  security-audit:
    needs: [lint-type-docs]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: npm audit (HIGH = 0, blocking)
        run: npm audit --audit-level=high
        continue-on-error: false
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo audit (HIGH = 0, blocking)
        run: cargo audit
